name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Arrange files into Android layout
        run: |
          mkdir -p app/src/main/java/com/sparkle/glass
          mv app_build.gradle app/build.gradle
          mv AndroidManifest.xml app/src/main/AndroidManifest.xml
          mv MainActivity.java GlassRenderer.java app/src/main/java/com/sparkle/glass/
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: sparkle-glass-apk
          path: app/build/outputs/apk/debug/app-debug.apk
